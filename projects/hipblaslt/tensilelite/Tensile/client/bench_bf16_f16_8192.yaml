  # BF16 HPA TN — subtile path
  # Source: Tensile/Tests/common/gemm/gfx950/subtile_bf16.yaml problem[0] group[0]
  # 372 valid solutions at various sizes; MI=[16,16,32,...], DU=64, UseSubtileImpl=true
  ########################################
  -
    - # ProblemType: BF16 HPA TN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          # 1x1 wave group
          - [16, 16, 32, 1,  1, 2, 2,  1, 1]  # MT 32x32
          - [16, 16, 32, 1,  1, 4, 2,  1, 1]  # MT 64x32
          # 2x2 wave group — symmetric
          - [16, 16, 32, 1,  1, 1, 1,  2, 2]  # MT 32x32
          - [16, 16, 32, 1,  1, 4, 4,  2, 2]  # MT 128x128
          - [16, 16, 32, 1,  1, 8, 8,  2, 2]  # MT 256x256
          - [16, 16, 32, 1,  1, 12, 8, 2, 2]  # MT 384x256
          - [16, 16, 32, 1,  1, 10, 10, 2, 2] # MT 320x320
          - [16, 16, 32, 1,  1, 8, 12, 2, 2]  # MT 256x384
          # 2x2 wave group — large tiles at/near LDS limit
