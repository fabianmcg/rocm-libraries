#
# bench_bf16_f16_8192.yaml: comprehensive gfx950 bf16/f16 HPA sweep at 8192^3.
#
# Kernel parameters taken verbatim from:
#   Tensile/Tests/common/gemm/gfx950/subtile_bf16.yaml   (BF16 MI=[16,16,32,...], DU=64)
#   Tensile/Tests/common/gemm/gfx950/custom_mainloop_scheduling.yaml (BF16 NN, LDSTrInst)
#   Tensile/Tests/common/gemm/bf16_tn.yaml               (BF16 MI=[16,16,16,...], DU=32/64)
#   Tensile/Tests/common/gemm/fp16_tn.yaml               (F16  MI=[16,16,16,...] & [32,32,8,...])
#   Tensile/client/bench_comparison.yaml                 (BF16 NN CMS variants)
#
# Notes:
#   - StreamK: [0] only — StreamK=3 requires the hipblaslt runtime, not the standalone client.
#   - SyncsPerBenchmark: 1 to avoid -nan GFLOPS from divide-by-zero.
#   - NumElementsToValidate: 0 — validation is done separately via bench_sweep.sh.

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  CMakeBuildType: Release
  PrintLevel: 1
  ForceRedoBenchmarkProblems: True
  ForceRedoLibraryLogic: True
  ForceRedoLibraryClient: True
  NumElementsToValidate: 0
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  KernelTime: True
  SyncsPerBenchmark: 1
  Device: 0
  UseEffLike: False
  PrintWinnersOnly: True
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  DataInitTypeA: 12
  DataInitTypeB: 13

BenchmarkProblems:
  ########################################
  # BF16 HPA TN — large symmetric tiles
  # Source: Tensile/Tests/common/gemm/gfx950/subtile_bf16.yaml (groups 1 and 2)
  # MI=[16,16,32,...], DU=64, UseSubtileImpl=true
  ########################################
  -
    - # ProblemType: BF16 HPA TN
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          # 2x2 wave group — symmetric
          - [16, 16, 32, 1, 1, 4, 4,  2, 2]   # MT 128x128
          - [16, 16, 32, 1, 1, 8, 8,  2, 2]   # MT 256x256
          - [16, 16, 32, 1, 1, 10, 10, 2, 2]  # MT 320x320
          - [16, 16, 32, 1, 1, 9, 9,  2, 2]   # MT 288x288
          # 2x2 wave group — asymmetric
          - [16, 16, 32, 1, 1, 6, 4,  2, 2]   # MT 192x128
          - [16, 16, 32, 1, 1, 8, 6,  2, 2]   # MT 256x192
          - [16, 16, 32, 1, 1, 12, 8, 2, 2]   # MT 384x256
          - [16, 16, 32, 1, 1, 8, 12, 2, 2]   # MT 256x384
          - [16, 16, 32, 1, 1, 14, 6, 2, 2]   # MT 448x192
          - [16, 16, 32, 1, 1, 6, 14, 2, 2]   # MT 192x448
          - [16, 16, 32, 1, 1, 16, 4, 2, 2]   # MT 512x128
          - [16, 16, 32, 1, 1, 4, 16, 2, 2]   # MT 128x512
          - [16, 16, 32, 1, 1, 3, 4,  2, 2]   # MT 96x128  (odd M wavetile)
          - [16, 16, 32, 1, 1, 1, 4,  2, 2]   # MT 32x128  (MIWT 1x4)
          - [16, 16, 32, 1, 1, 4, 2,  2, 2]   # MT 128x64  (MIWT 4x2)
          - [16, 16, 32, 1, 1, 2, 2,  2, 2]   # MT 64x64
          # 4x1 wave group
          - [16, 16, 32, 1, 1, 2, 2,  4, 1]   # MT 128x32
          - [16, 16, 32, 1, 1, 2, 6,  4, 1]   # MT 128x96
          - [16, 16, 32, 1, 1, 8, 8,  4, 1]   # MT 512x128
          - [16, 16, 32, 1, 1, 5, 20, 4, 1]   # MT 320x320
          # 1x4 wave group
          - [16, 16, 32, 1, 1, 8, 8,  1, 4]   # MT 128x512
          - [16, 16, 32, 1, 1, 20, 5, 1, 4]   # MT 320x320
          - [16, 16, 32, 1, 1, 24, 4, 1, 4]   # MT 384x256
          - [16, 16, 32, 1, 1, 32, 2, 1, 4]   # MT 512x128
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [8192, 8192, 1, 8192]

  ########################################
  # BF16 HPA TN — large DU variants
  # Source: Tensile/Tests/common/gemm/gfx950/subtile_bf16.yaml (group 2: DU=128,192)
  # Representative subset of tiles with DU=128 and DU=192
