#
# bench_bf16_f16_8192.yaml: gfx950 bf16/f16 HPA sweep at 8192^3.
#
# Kernel parameters taken verbatim from:
#   Tensile/Tests/common/gemm/gfx950/subtile_bf16.yaml  (BF16 TN group[0])
#   Tensile/Tests/common/gemm/gfx950/plr_zero.yaml      (F16 TN/NN/TT/NT groups)
#
# Notes:
#   - StreamK: [0] — StreamK=3 requires the hipblaslt runtime, not the standalone client.
#   - NumElementsToValidate: -1 — validation is done separately.
#   - SkipGroupsWithNoSolutions: True.

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  CMakeBuildType: Release
  PrintLevel: 1
  SkipGroupsWithNoSolutions: True
  ForceRedoBenchmarkProblems: True
  ForceRedoLibraryLogic: True
  ForceRedoLibraryClient: True
  NumElementsToValidate: -1
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  KernelTime: True
  SyncsPerBenchmark: 1
  Device: 0
  UseEffLike: False
  PrintWinnersOnly: True
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  DataInitTypeA: 12
  DataInitTypeB: 13

BenchmarkProblems:
