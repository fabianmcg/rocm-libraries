          - [16, 16, 32, 1, 1, 8, 7,  2, 2]   # MT 256x224
          - [16, 16, 32, 1, 1, 8, 6,  2, 2]   # MT 256x192
          - [16, 16, 32, 1, 1, 7, 8,  2, 2]   # MT 224x256
          - [16, 16, 32, 1, 1, 6, 10, 2, 2]   # MT 192x320
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - TransposeLDS: [1]
        - LocalReadVectorWidth: [8]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - DirectToLds: [1]
        - StreamK: [0]
        - LdsPadA: [8]
