  -
    - # ProblemType: BF16 HPA TN (large DU)
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1, 1, 4, 4,  2, 2]   # MT 128x128
          - [16, 16, 32, 1, 1, 8, 8,  2, 2]   # MT 256x256
          - [16, 16, 32, 1, 1, 6, 4,  2, 2]   # MT 192x128
          - [16, 16, 32, 1, 1, 2, 6,  4, 1]   # MT 128x96 (4x1 WG)
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [128, 192]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [true]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [8192, 8192, 1, 8192]

