#
# bench_comparison.yaml: real-world gfx950 bf16 HPA sweep for client benchmarking.
#
# Kernel parameters taken verbatim from:
#   Tensile/Tests/common/gemm/gfx950/custom_mainloop_scheduling.yaml
# Groups 1-2 (BBS NN, UseCustomMainLoopSchedule=[0,1]) kept; groups with
# Range-only small sizes replaced with large Exact sizes for the benchmark.
# LibraryLogic/LibraryClient sections added to make this a full pipeline YAML.

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  CMakeBuildType: Release
  PrintLevel: 1
  ForceRedoBenchmarkProblems: True
  ForceRedoLibraryLogic: True
  ForceRedoLibraryClient: True
  EnqueuesPerSync: 1
  SyncsPerBenchmark: 0
  NumElementsToValidate: -1
  ValidationMaxToPrint: 4
  ValidationPrintValids: False
  KernelTime: True
  Device: 0
  UseEffLike: False
  PrintWinnersOnly: True
  DataInitTypeBeta: 0
  DataInitTypeAlpha: 1
  DataInitTypeA: 12
  DataInitTypeB: 13

BenchmarkProblems:
  ########################################
  # BBS NN — [16,16,32,1,1,8,8,2,2] CMS
