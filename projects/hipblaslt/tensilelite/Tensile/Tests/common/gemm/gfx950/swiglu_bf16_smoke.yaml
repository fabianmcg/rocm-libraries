#
# Fused GEMM + SwiGLU Subtile epilogue smoke test (gfx950, bf16).
#
# SwiGLU applies the global split gate = (A@B)[:, :N_out], up = (A@B)[:, N_out:]
# and computes y = up * silu(gate) fully on-chip, storing only (M, N_out=N_gemm/2)
# to D. Hard constraints exercised here:
#   - N (SizesFree1) must be a positive multiple of MacroTile1 (multi-tile N supported).
#       MI [16,16,32,1, 1,4,4, 1,1] -> MacroTile1 = 64  -> use N = 64, 128, 256, ...
#       MI [16,16,32,1, 1,4,4, 1,2] -> MacroTile1 = 128 -> use N = 128, 256, 512, ...
#   - SwiGLU only works with UseSubtileImpl=1 + StreamK=3 + StreamKForceDPOnly=1.
#   - alpha must be 1, beta must be 0 (DataInitTypeAlpha=1, DataInitTypeBeta=0).
#   - Numerical validation is enabled; the C++ reference is a geometry-free
#     global-split oracle.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, swiglu]

GlobalParameters:
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 1
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  ########################################
  # wg_n = 1 : MacroTile1 = 64  -> N_gemm = 64, N_out = 32
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 1]  # MT 64x64, MIWaveGroup [1,1]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - SwiGLU: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64,  64, 1,  64]
          - Exact: [128, 64, 1, 128]
          - Exact: [256, 64, 1, 256]
          - Exact: [48,  64, 1,  64]
          - Exact: [200, 64, 1,  64]
          - Exact: [64,  128, 1,  64]    # N_gemm = 2 * MT1 (multi-tile N)
          - Exact: [200, 128, 1,  64]    # multi-tile N + edge M
          - Exact: [64,  256, 1,  64]    # N_gemm = 4 * MT1 (multi-tile N)

  ########################################
  # wg_n = 2 : MacroTile1 = 128 -> N_gemm = 128, N_out = 64
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 4, 4,  1, 2]  # MT 64x128, MIWaveGroup [1,2]
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [0]
        - DepthU: [64]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
        - SwiGLU: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [64,  128, 1,  64]
          - Exact: [128, 128, 1, 128]
          - Exact: [256, 128, 1, 256]
          - Exact: [48,  128, 1,  64]
          - Exact: [200, 128, 1,  64]
          - Exact: [64,  256, 1,  64]    # N_gemm = 2 * MT1 (multi-tile N)
          - Exact: [200, 256, 1,  64]    # multi-tile N + edge M
          - Exact: [64,  512, 1,  64]    # N_gemm = 4 * MT1 (multi-tile N)
