# PartialRMS + ResidualAdd (K1), bf16 in / bf16 out, on StreamK (DP-only).
#
# Subtile fused epilogues (PartialRMS, ResidualAdd) require the fully assembled
# macro tile in the accumulator. StreamK without StreamKForceDPOnly emits a
# deferred MultipleBuffer store path (gsuLimit==2) whose split-K finishing
# workgroups reduce through a workspace/conversion step, so the epilogue would
# run on an un-reduced partial tile. That combination is therefore rejected at
# solution-validation time (see _validateSubtileEpiloguePrereqs in Solution.py).
#
# This test validates the SUPPORTED StreamK configuration: StreamKForceDPOnly=1
# forces whole-tile DP dispatch, so every workgroup owns a complete tile and the
# epilogue sees the fully assembled result. It exercises the bf16-in/bf16-out
# PartialRMS + ResidualAdd chain (dual bf16 D + ResidualOut store) on the StreamK
# code path. NumElementsToValidate=-1 with ExitOnFails=1 validates every element.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1
  ExitOnFails: 1
  PrintSolutionRejectionReason: True

BenchmarkProblems:

  ########################################
  # bf16 in, bf16 out — PartialRMS + ResidualAdd on StreamK DP-only
  # (StreamKForceDPOnly=1): whole-tile dispatch so the epilogue sees the full tile.
  ########################################
  -
    - # ProblemType — bf16 in, bf16 out, f32 compute, residual add
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1,  8,  8, 1, 1]  # MT0=128  MT1=128  WG 1x1
            - [16, 16, 32, 1, 1,  4,  8, 2, 1]  # MT0=128  MT1=128  WG 2x1
        - PartialRMS: [True]
        - PartialRMSResidualAdd: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [1024, 1024, 1, 4096]

LibraryLogic:
  ScheduleName: "partialrms_residualadd_bf16_streamk_split_bug_repro"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
  LibraryType: "Prediction"
