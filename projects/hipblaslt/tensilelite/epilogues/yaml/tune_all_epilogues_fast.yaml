#
# Fast single-tile, single-size variant of tune_all_epilogues.yaml.
# Designed to complete a full build + logic generation round in under 5 minutes.
#
# Entry order (indices 0–3) must match tune_all_epilogues.sh:
#   0 — plain GEMM (no epilogue flags)
#   1 — GEMM + PartialRMS (no residual add)
#   2 — GEMM + PartialRMS + residual add  (wg0 <= 2 required)
#   3 — GEMM + RstdScale

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 0

BenchmarkProblems:
  # --------------------------------------------------------------------------
  # Index 0 — plain bf16 TN GEMM, no epilogue flags.
  # --------------------------------------------------------------------------
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0

    - # BenchmarkProblemSizeGroup
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 4, 2, 2]   # MT128x128, wg0=2, wg1=2
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - DirectToLds: [1]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [512, 512, 1, 512]

  # --------------------------------------------------------------------------
  # Index 1 — GEMM + PartialRMS epilogue, no residual add.
  # --------------------------------------------------------------------------
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: False

    - # BenchmarkProblemSizeGroup
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 1]   # MT0=64 MT1=128, wg0=1 wg1=1
        - PartialRMSResidualAdd: [False]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [512, 512, 1, 512]

  # --------------------------------------------------------------------------
  # Index 2 — GEMM + PartialRMS + residual add.
  # IMPORTANT: wg0 (index 7 of MatrixInstruction) must be <= 2.
  # --------------------------------------------------------------------------
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: True

    - # BenchmarkProblemSizeGroup
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 2, 2]   # MT0=128 MT1=256, wg0=2 wg1=2
        - PartialRMSResidualAdd: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [512, 512, 1, 512]

  # --------------------------------------------------------------------------
  # Index 3 — GEMM + RstdScale epilogue.
  # --------------------------------------------------------------------------
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      RstdScale: True

    - # BenchmarkProblemSizeGroup
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 4, 1, 1]   # MT 64x64, wg_n=1
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - RstdScale: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [512, 64, 1, 512]

LibraryLogic:
  ScheduleName: "tune_all_epilogues"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
