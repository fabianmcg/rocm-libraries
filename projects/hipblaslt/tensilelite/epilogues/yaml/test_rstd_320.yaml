# RstdScale test at MT320x320 — mirrors best_bf16_8192_prms.yaml but uses RstdScale.
# RstdScale is Phase 3 (K3): loads per-row rstd from rstdBuf and multiplies accumulators.
# MT320x320 is a multiple of 64 but not a power of 2; checking whether the validator accepts it.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  SyncsPerBenchmark: 5
  PrintSolutionRejectionReason: True
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 1
  Device: 0
  CMakeBuildType: Release
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 3
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 2
  BoundsCheck: 0
  KeepBuildTmp: True
  CpuThreads: 1
  RotatingBufferSize: 0

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: true
      TransposeB: false
      UseBeta: True
      Batched: True
      UseBias: 0
      UseScaleAlphaVec: 0
      RstdScale: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 32, 1,  1, 10, 10, 2, 2]  # MT 320x320
        - PrefetchGlobalRead: [1]
        - PrefetchLocalRead: [1]
        - DepthU: [64]
        - StreamK: [3]
        - StaggerU: [0]
        - 1LDSBuffer: [0]
        - NonTemporalD: [4]
        - SourceSwap: [true]
        - WorkGroupMapping: [16]
        - WorkGroupMappingXCC: [4]
        - UseSubtileImpl: [true]
        - UseCustomMainLoopSchedule: [0]
        - RstdScale: [True]
        - StreamKForceDPOnly: [1]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [8192, 8192, 1, 8192]
