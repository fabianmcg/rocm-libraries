GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128

BenchmarkProblems:
  -
    - # ProblemType — bfp8 (OCP e5m2) TN GEMM with RstdScale epilogue
      OperationType: GEMM
      DataType: B8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      RstdScale: True

    - # BenchmarkProblemSizeGroup
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 128, 1, 1, 4, 4, 1, 1]   # MT 64x64,  wg_n=1
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - RstdScale: [True]
        - StaggerU: [0]
        - DepthU: [128]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
      # ProblemSizes: Exact [M, N_out, batch, N_hidden] — N_out=64 (one tile wide).
      # These are both the benchmark sizes for TensileCreateLibrary and the test shapes
      # read by problemSizesFromYaml(). The test uses sizes[0]=M and sizes[3]=N_hidden.
      BenchmarkFinalParameters:
        - ProblemSizes:
            # full-tile M, varying N_hidden
            - Exact: [  64,   64, 1,    1]
            - Exact: [  64,   64, 1,   32]
            - Exact: [  64,   64, 1,   64]
            - Exact: [  64,   64, 1,   96]
            - Exact: [  64,   64, 1,  128]
            - Exact: [  64,   64, 1,  256]
            - Exact: [  64,   64, 1,  512]
            - Exact: [  64,   64, 1, 1024]
            - Exact: [  64,   64, 1, 4096]
            # larger full-tile M
            - Exact: [ 128,   64, 1,  128]
            - Exact: [ 256,   64, 1,   64]
            - Exact: [ 512,   64, 1,  512]
            - Exact: [1024,   64, 1,  128]
            - Exact: [2048,   64, 1, 4096]
            # edge-tile M (non-multiples of MT0=64)
            - Exact: [   1,   64, 1,   64]
            - Exact: [  16,   64, 1,   64]
            - Exact: [  32,   64, 1,   64]
            - Exact: [  48,   64, 1,   64]
            - Exact: [  80,   64, 1,   96]
            - Exact: [ 100,   64, 1,  128]
            - Exact: [ 130,   64, 1,   37]
            - Exact: [ 200,   64, 1,   64]
            - Exact: [ 513,   64, 1,  256]
            - Exact: [1000,   64, 1, 1024]
            # prime N_hidden — exercises non-DepthU-aligned loop tail
            - Exact: [  64,   64, 1,   31]
            - Exact: [  64,   64, 1,   97]
            - Exact: [  64,   64, 1,  127]
            - Exact: [ 128,   64, 1,   61]
            - Exact: [1024,   64, 1, 4093]

LibraryLogic:
  ScheduleName: "rstdscale_k3_bf8"
  DeviceNames: ["Device 74a1", "Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
