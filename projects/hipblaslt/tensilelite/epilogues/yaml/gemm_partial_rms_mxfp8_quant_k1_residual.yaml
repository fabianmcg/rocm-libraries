GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  # Pipeline benchmark validation is disabled so LibraryLogic always receives
  # valid GFlops data. Correctness is verified by the explicit GPU tests in
  # test_gemm_partial_rms_mxfp8_quant.py.
  NumElementsToValidate: 0
  ExitOnFails: 0

BenchmarkProblems:
  # --------------------------------------------------------------------------
  # PartialRMS+MXFP8Quant+ResidualAdd (K1): fused GEMM + residual add +
  # per-row Σx² partial stat + per-block e8m0 dynamic fp8 quantization.
  #
  # Data flow:
  #   1. ResidualAdd: acc += residual[row, col] (bf16 load, matching input dtype).
  #   2. PartialRMS: writes Σx² of acc (already = h1+residual) to partialBuf, then
  #      applies gamma in-place (acc becomes gamma·(h1+residual)).
  #   3. MXFP8Quant: computes amax per block, derives e8m0 byte, scales acc,
  #      writes e8m0 byte to MXScale.
  #   4. Standard store: writes fp8 D = SaturateCast<e4m3>(quantMult·gamma·acc).
  #
  # wg0 <= 2 is required: residual-add kernels load residual as bf16 (one full
  # row per wg0 wavefront), so larger wg0 values exceed the LDS budget.
  # --------------------------------------------------------------------------
  -
    - # ProblemType — bf16 in, OCP fp8 e4m3 out, f32 compute, residual add
      OperationType: GEMM
      DataType: b
      DestDataType: F8
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: True
      PartialRMSQuant: False
      DQuantType: MXFP8

    # Group 1: sub-row quant tile 1x32 (canonical MX block — primary path).
    - BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 1]   # MT0=64   MT1=128  wg0=1 wg1=1
            - [16, 16, 32, 1, 1, 4, 8, 2, 1]   # MT0=128  MT1=128  wg0=2 wg1=1
        - PartialRMS: [True]
        - PartialRMSResidualAdd: [True]
        - PartialRMSQuant: [False]
        - DQuantType: [MXFP8]
        - DQuantSize0: [32]
        - DQuantSize1: [1]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
            # These sizes cover the test dimensions (256×2048×128) and a smaller
            # warm-up problem; both use the K1 sub-row quant shape.
            - Exact: [128, 256, 1, 64]
            - Exact: [256, 2048, 1, 128]

# TestAxes is read by readTestAxes() in yaml_solution_builder and is not
# consumed by TensileCreateLibrary.
TestAxes:
  K1_RA:
    MMultipliers: [1, 2]
    MFixed:       [1, 7, 129]
    KNHidden:     [[64, 128], [256, 512]]

LibraryLogic:
  ScheduleName: "partialrms_mxfp8_quant_k1"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
