#
# Comprehensive tuning YAML for the RstdScale (K3) fused epilogue at shape 8192^3.
# RstdScale loads a pre-computed per-row rstd scalar from rstdBuf and multiplies
# every GEMM accumulator element of that row in-place (no reduction, no LDS).
# Covers all 5 tile sizes, DirectToLds on/off, DepthU sweep, PGR sweep, StaggerU,
# and PreloadKernArgs.
#
# Constraints that bound the search:
#   - UseSubtileImpl=True, StreamK=3, StreamKForceDPOnly=1 required by RstdScale.
#   - RstdScale rejects PrefetchAcrossPersistent, so PAP is fixed at 0.
#   - StreamKForceDPOnly=1 rejects StreamKAtomic=1, so StreamKAtomic is fixed at 0.
#   - 1LDSBuffer must be 0 when DirectToLds=1.
#   - DepthU must be a multiple of numSubIterK*MatrixInstK*LocalSplitU (=32).
#
# Four groups, one per (MT1, DirectToLds) combination, to maximize legal combos:
#   Group A: MT1=128, DirectToLds=1  (1LDSBuffer forced 0)
#   Group B: MT1=128, DirectToLds=0  (1LDSBuffer free)
#   Group C: MT1=256, DirectToLds=1  (1LDSBuffer forced 0)
#   Group D: MT1=256, DirectToLds=0  (1LDSBuffer free)

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      RstdScale: True

    # ------------------------------------------------------------------
    # Group A: MT1=128 (wg1=1), DirectToLds=1, 1LDSBuffer=0
    # ------------------------------------------------------------------
    - BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 1]   # MT0=64  MT1=128
            - [16, 16, 32, 1, 1, 4, 8, 2, 1]   # MT0=128 MT1=128
            - [16, 16, 32, 1, 1, 4, 8, 4, 1]   # MT0=256 MT1=128
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - 1LDSBuffer: [0]
        - UseSubtileImpl: [True]
        - RstdScale: [True]
        - StaggerU: [0, 8]
        - DepthU: [32, 64, 128]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False, True]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [8192, 8192, 1, 8192]

    # ------------------------------------------------------------------
    # Group B: MT1=128 (wg1=1), DirectToLds=0, 1LDSBuffer free
    # ------------------------------------------------------------------
    - BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 1]   # MT0=64  MT1=128
            - [16, 16, 32, 1, 1, 4, 8, 2, 1]   # MT0=128 MT1=128
            - [16, 16, 32, 1, 1, 4, 8, 4, 1]   # MT0=256 MT1=128
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [0]
        - 1LDSBuffer: [0, 1]
        - UseSubtileImpl: [True]
        - RstdScale: [True]
        - StaggerU: [0, 8]
        - DepthU: [32, 64, 128]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False, True]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [8192, 8192, 1, 8192]

    # ------------------------------------------------------------------
    # Group C: MT1=256 (wg1=2), DirectToLds=1, 1LDSBuffer=0
    # ------------------------------------------------------------------
    - BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 2]   # MT0=64  MT1=256
            - [16, 16, 32, 1, 1, 4, 8, 4, 2]   # MT0=256 MT1=256
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - 1LDSBuffer: [0]
        - UseSubtileImpl: [True]
        - RstdScale: [True]
        - StaggerU: [0, 8]
        - DepthU: [32, 64, 128]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False, True]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [8192, 8192, 1, 8192]

    # ------------------------------------------------------------------
    # Group D: MT1=256 (wg1=2), DirectToLds=0, 1LDSBuffer free
    # ------------------------------------------------------------------
    - BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 2]   # MT0=64  MT1=256
            - [16, 16, 32, 1, 1, 4, 8, 4, 2]   # MT0=256 MT1=256
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [0]
        - 1LDSBuffer: [0, 1]
        - UseSubtileImpl: [True]
        - RstdScale: [True]
        - StaggerU: [0, 8]
        - DepthU: [32, 64, 128]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False, True]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [8192, 8192, 1, 8192]

LibraryLogic:
  ScheduleName: "tune_rstd_8192"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
