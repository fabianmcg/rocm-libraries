GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128

BenchmarkProblems:
  # --------------------------------------------------------------------------
  # PartialRMSQuant (K1): fused GEMM + PartialRMS + amax epilogue.
  # Writes Σx² (first half) and amax(|D|)/fp8_max (second half) into
  # partialBuf[2*M_padded, n_d]. Gamma is applied in-place before the amax.
  # --------------------------------------------------------------------------
  -
    - # ProblemType — bf16 TN GEMM with PartialRMS + Quant epilogue
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: False
      PartialRMSQuant: True

    - # Single-wave (wg0=1) and cross-wave (wg0=2) free0 tiles — no PAP
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 1]   # MT0=64   MT1=128  wg0=1 wg1=1
            - [16, 16, 32, 1, 1, 4, 8, 2, 1]   # MT0=128  MT1=128  wg0=2 wg1=1
        - PartialRMSResidualAdd: [False]
        - PartialRMS: [True]
        - PartialRMSQuant: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [True]
        - 1LDSBuffer: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [512, 512, 1, 512]
            - Exact: [4096, 4096, 1, 4096]

# TestAxes is read by testAxesFromYaml() in yaml_solution_builder and is not
# consumed by TensileCreateLibrary.
TestAxes:
  K1:
    MMultipliers: [1, 2]
    MFixed:       [1, 7, 129]
    KNHidden:     [[64, 128], [256, 512]]

LibraryLogic:
  ScheduleName: "partialrms_quant_k1"
  DeviceNames: ["Device 74a1", "Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
