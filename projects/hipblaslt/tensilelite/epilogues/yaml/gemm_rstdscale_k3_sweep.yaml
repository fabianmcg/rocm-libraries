#
# Comprehensive tuning sweep for the K3 RstdScale (GEMM + per-row rstd scale)
# fused epilogue kernel on gfx950 bf16 TN GEMM.
#
# This is a real tuning sweep (not a smoke test). It explores tile sizes,
# DepthU, prefetch depth, stagger, source-swap, work-group mapping, and
# non-temporal store hints across a representative set of problem shapes.
#
# Approximate candidate count before validation:
#   8 MI x 3 DepthU x 2 PLR x 2 StaggerU x 2 SourceSwap x 3 WGM x 2 NTD
#   = 576 candidates; ~300-400 typically survive Solution validation.
#
# Usage:
#   source /home/fmoracor/.tensile/bin/activate
#   cd /home/fmoracor/rocm-libraries/projects/hipblaslt/tensilelite
#   PYTHONPATH=tools:. python3 Tensile/bin/Tensile \
#       tools/gemm_rstdscale_k3_sweep.yaml /tmp/rstdscale_sweep \
#       --cxx-compiler /usr/bin/amdclang++ --gpu-targets gfx950

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1

BenchmarkProblems:
  -
    - # ProblemType — bf16 TN GEMM with RstdScale epilogue
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      RstdScale: True

    - # BenchmarkProblemSizeGroup
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - RstdScale: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - PrefetchGlobalRead: [1]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]

      ForkParameters:
        - MatrixInstruction:
            # MT64x64:   wg_n=1 (64 threads, 1 wave in N)
            - [16, 16, 32, 1, 1, 4, 4, 1, 1]
            # MT64x128:  wg_n=2 (128 threads, 2 waves in N)
            - [16, 16, 32, 1, 1, 4, 4, 1, 2]
            # MT64x256:  wg_n=4 (256 threads, 4 waves in N)
            - [16, 16, 32, 1, 1, 4, 4, 1, 4]
            # MT128x64:  wg_m=2, wg_n=1
            - [16, 16, 32, 1, 1, 4, 4, 2, 1]
            # MT128x128: wg_m=2, wg_n=2
            - [16, 16, 32, 1, 1, 4, 4, 2, 2]
            # MT128x256: wg_m=2, wg_n=4
            - [16, 16, 32, 1, 1, 4, 4, 2, 4]
            # MT256x64:  wg_m=4, wg_n=1
            - [16, 16, 32, 1, 1, 4, 4, 4, 1]
            # MT256x128: wg_m=4, wg_n=2
            - [16, 16, 32, 1, 1, 4, 4, 4, 2]
        - DepthU: [32, 64, 128]
        - PrefetchLocalRead: [1, 3]
        - StaggerU: [0, 32]
        - SourceSwap: [False, True]
        - WorkGroupMapping: [1, 4, 8]
        - NonTemporalD: [0, 7]
        - StreamKFixupTreeReduction: [0, 1]

      BenchmarkFinalParameters:
        - ProblemSizes:
            # Square shapes — standard LLM FFN/attention sizes
            - Exact: [1024, 1024, 1, 4096]
            - Exact: [2048, 2048, 1, 4096]
            - Exact: [4096, 4096, 1, 4096]
            - Exact: [4096, 4096, 1, 8192]
            - Exact: [8192, 8192, 1, 4096]
            - Exact: [8192, 8192, 1, 8192]
            # Rectangular shapes
            - Exact: [2048, 4096, 1, 4096]
            - Exact: [4096, 2048, 1, 4096]
            # Skinny N (small hidden dim, RstdScale use case)
            - Exact: [4096, 64, 1, 4096]
            - Exact: [4096, 128, 1, 4096]
            # Odd sizes (stress partial tiles)
            - Exact: [4099, 4096, 1, 4096]
            - Exact: [4096, 4099, 1, 4099]

LibraryLogic:
  ScheduleName: "rstdscale_k3"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2",
                "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
