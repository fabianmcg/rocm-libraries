#
# Comprehensive tuning YAML for PartialRMS (no residual add) at shape 8192^3.
# Covers all valid tile sizes, DirectToLds on/off, DepthU sweep, PGR sweep,
# PrefetchAcrossPersistent, StaggerU, StreamKAtomic, and PreloadKernArgs.
#
# Constraints that bound the search:
#   - UseSubtileImpl=True, StreamK=3, StreamKForceDPOnly=1 required by PartialRMS.
#   - UseSubtileImpl requires MatrixInstM=MatrixInstN=16.
#   - 1LDSBuffer must be 0 (forced by UseSubtileImpl).
#   - PrefetchAcrossPersistent rejected for all PartialRMS kernels.
#   - DepthU must be a multiple of 2*MatrixInstK*LocalSplitU = 64.
#   - PartialRMS constraint: MT0 // (16 * MIWaveGroup[0]) >= 1.
#
# Eight groups, one per (MT1, DirectToLds) combination:
#   MT1=128: Groups A (DTL=1) and B (DTL=0)
#   MT1=256: Groups C (DTL=1) and D (DTL=0)
#   MT1=128 non-square (MT0=256): Groups E (DTL=1) and F (DTL=0)
#   MT1=256 non-square (MT0=128): Groups G (DTL=1) and H (DTL=0)
#
# New tile configs vs prior version:
#   MT128x128: added [1,1,8,8,1,1] (WG=[4,16])  and [1,1,2,8,4,1] (WG=[16,16])
#   MT256x256: added [1,1,8,8,2,2] (WG=[8,32])  and [1,1,2,8,8,2] (WG=[32,32])
#   MT256x128: added [1,1,8,8,2,1] (WG=[8,16])  and [1,1,2,8,8,1] (WG=[32,16])
#   MT128x256: added [1,1,8,8,1,2] (WG=[4,32]), [1,1,4,8,2,2] (WG=[8,32]),
#              and   [1,1,2,8,4,2] (WG=[16,32])

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: -1

BenchmarkProblems:
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: False

    # ------------------------------------------------------------------
    # Group A: MT1=128 (wg1=1), DirectToLds=1, 1LDSBuffer=0
    # ------------------------------------------------------------------
    - BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 1]   # MT0=64   MT1=128  WG=[4,16]   MIWaveGroup=[1,1]
            - [16, 16, 32, 1, 1, 4, 8, 2, 1]   # MT0=128  MT1=128  WG=[8,16]   MIWaveGroup=[2,1]
            - [16, 16, 32, 1, 1, 4, 8, 4, 1]   # MT0=256  MT1=128  WG=[16,16]  MIWaveGroup=[4,1]
            - [16, 16, 32, 1, 1, 8, 8, 1, 1]   # MT0=128  MT1=128  WG=[4,16]   MIWaveGroup=[1,1]
            - [16, 16, 32, 1, 1, 2, 8, 4, 1]   # MT0=128  MT1=128  WG=[16,16]  MIWaveGroup=[4,1]
            - [16, 16, 32, 1, 1, 8, 8, 2, 1]   # MT0=256  MT1=128  WG=[8,16]   MIWaveGroup=[2,1]
            - [16, 16, 32, 1, 1, 2, 8, 8, 1]   # MT0=256  MT1=128  WG=[32,16]  MIWaveGroup=[8,1]
        - PartialRMSResidualAdd: [False]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - 1LDSBuffer: [0]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - StaggerU: [0, 8]
        - DepthU: [64, 128]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False, True]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [8192, 8192, 1, 8192]

    # ------------------------------------------------------------------
    # Group B: MT1=128 (wg1=1), DirectToLds=0, 1LDSBuffer=0
    # ------------------------------------------------------------------
    - BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 1]   # MT0=64   MT1=128  WG=[4,16]   MIWaveGroup=[1,1]
            - [16, 16, 32, 1, 1, 4, 8, 2, 1]   # MT0=128  MT1=128  WG=[8,16]   MIWaveGroup=[2,1]
            - [16, 16, 32, 1, 1, 4, 8, 4, 1]   # MT0=256  MT1=128  WG=[16,16]  MIWaveGroup=[4,1]
            - [16, 16, 32, 1, 1, 8, 8, 1, 1]   # MT0=128  MT1=128  WG=[4,16]   MIWaveGroup=[1,1]
            - [16, 16, 32, 1, 1, 2, 8, 4, 1]   # MT0=128  MT1=128  WG=[16,16]  MIWaveGroup=[4,1]
            - [16, 16, 32, 1, 1, 8, 8, 2, 1]   # MT0=256  MT1=128  WG=[8,16]   MIWaveGroup=[2,1]
            - [16, 16, 32, 1, 1, 2, 8, 8, 1]   # MT0=256  MT1=128  WG=[32,16]  MIWaveGroup=[8,1]
        - PartialRMSResidualAdd: [False]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [0]
        - 1LDSBuffer: [0]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - StaggerU: [0, 8]
        - DepthU: [64, 128]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False, True]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [8192, 8192, 1, 8192]

    # ------------------------------------------------------------------
    # Group C: MT1=256 (wg1=2), DirectToLds=1, 1LDSBuffer=0
    # ------------------------------------------------------------------
    - BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 2]   # MT0=64   MT1=256  WG=[4,32]   MIWaveGroup=[1,2]
            - [16, 16, 32, 1, 1, 4, 8, 4, 2]   # MT0=256  MT1=256  WG=[16,32]  MIWaveGroup=[4,2]
            - [16, 16, 32, 1, 1, 8, 8, 2, 2]   # MT0=256  MT1=256  WG=[8,32]   MIWaveGroup=[2,2]
            - [16, 16, 32, 1, 1, 2, 8, 8, 2]   # MT0=256  MT1=256  WG=[32,32]  MIWaveGroup=[8,2]
            - [16, 16, 32, 1, 1, 8, 8, 1, 2]   # MT0=128  MT1=256  WG=[4,32]   MIWaveGroup=[1,2]
            - [16, 16, 32, 1, 1, 4, 8, 2, 2]   # MT0=128  MT1=256  WG=[8,32]   MIWaveGroup=[2,2]
            - [16, 16, 32, 1, 1, 2, 8, 4, 2]   # MT0=128  MT1=256  WG=[16,32]  MIWaveGroup=[4,2]
        - PartialRMSResidualAdd: [False]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - 1LDSBuffer: [0]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - StaggerU: [0, 8]
        - DepthU: [64, 128]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False, True]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [8192, 8192, 1, 8192]

    # ------------------------------------------------------------------
    # Group D: MT1=256 (wg1=2), DirectToLds=0, 1LDSBuffer=0
    # ------------------------------------------------------------------
    - BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 2]   # MT0=64   MT1=256  WG=[4,32]   MIWaveGroup=[1,2]
            - [16, 16, 32, 1, 1, 4, 8, 4, 2]   # MT0=256  MT1=256  WG=[16,32]  MIWaveGroup=[4,2]
            - [16, 16, 32, 1, 1, 8, 8, 2, 2]   # MT0=256  MT1=256  WG=[8,32]   MIWaveGroup=[2,2]
            - [16, 16, 32, 1, 1, 2, 8, 8, 2]   # MT0=256  MT1=256  WG=[32,32]  MIWaveGroup=[8,2]
            - [16, 16, 32, 1, 1, 8, 8, 1, 2]   # MT0=128  MT1=256  WG=[4,32]   MIWaveGroup=[1,2]
            - [16, 16, 32, 1, 1, 4, 8, 2, 2]   # MT0=128  MT1=256  WG=[8,32]   MIWaveGroup=[2,2]
            - [16, 16, 32, 1, 1, 2, 8, 4, 2]   # MT0=128  MT1=256  WG=[16,32]  MIWaveGroup=[4,2]
        - PartialRMSResidualAdd: [False]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1, 2]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [0]
        - 1LDSBuffer: [0]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - StaggerU: [0, 8]
        - DepthU: [64, 128]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False, True]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [8192, 8192, 1, 8192]

LibraryLogic:
  ScheduleName: "tune_prms_8192"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
