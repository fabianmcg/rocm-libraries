#
# Four bf16 TN GEMM variants for gfx950:
#   v1 — plain GEMM, no epilogue flags
#   v2 — PartialRMS epilogue, no residual add
#   v3 — PartialRMS + residual add epilogue (wg_m <= 2 required)
#   v4 — RstdScale epilogue
#
# For parallel tuning on separate GPUs, split at each BenchmarkProblems entry
# and pass --device <N> to the Tensile runner per variant.

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128

BenchmarkProblems:
  # --------------------------------------------------------------------------
  # v1 — Plain bf16 TN GEMM, no epilogue flags.
  # Predicates: UsePartialRMS=False, UseRstdScale=False, UsePartialRMSResidualAdd=False
  # --------------------------------------------------------------------------
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0

    - # BenchmarkProblemSizeGroup
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - StaggerU: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 4, 1, 1]  # MT 64x64,   wg_m=1, wg_n=1
            - [16, 16, 32, 1, 1, 4, 4, 2, 2]  # MT 128x128, wg_m=2, wg_n=2
        - DepthU: [32, 64]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [4096, 4096, 1, 4096]

  # --------------------------------------------------------------------------
  # v2 — PartialRMS epilogue, no residual add.
  # Predicates: UsePartialRMS=True, UseRstdScale=False, UsePartialRMSResidualAdd=False
  # --------------------------------------------------------------------------
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: False

    - # BenchmarkProblemSizeGroup
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - PartialRMSResidualAdd: [False]
        - StaggerU: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 4, 1, 1]  # MT 64x64, wg_m=1, wg_n=1 (MT1=64 fixed)
        - DepthU: [32, 64]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [4096, 4096, 1, 4096]

  # --------------------------------------------------------------------------
  # v3 — PartialRMS + residual add epilogue.
  # Predicates: UsePartialRMS=True, UseRstdScale=False, UsePartialRMSResidualAdd=True
  # IMPORTANT: wg_m (index 7 of MatrixInstruction) must be <= 2; wg_m=4 gives
  # wrong results for the residual add path.
  # --------------------------------------------------------------------------
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: True

    - # BenchmarkProblemSizeGroup
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - PartialRMSResidualAdd: [True]
        - StaggerU: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
      ForkParameters:
        - MatrixInstruction:
            # wg_m=2 (index 7) — wg_m <= 2 is required to avoid wrong results for residual add.
            - [16, 16, 32, 1, 1, 4, 8, 2, 2]  # MT 128x256, wg_m=2, wg_n=2 (MT1=256 fixed)
        - DepthU: [32, 64]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [4096, 4096, 1, 4096]

  # --------------------------------------------------------------------------
  # v4 — RstdScale epilogue.
  # Predicates: UsePartialRMS=False, UseRstdScale=True, UsePartialRMSResidualAdd=False
  # RstdScale: True in ProblemType ensures UseRstdScale predicate emits True
  # in the merged library, distinguishing this from the plain GEMM variant.
  # --------------------------------------------------------------------------
  -
    - # ProblemType
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      RstdScale: True

    - # BenchmarkProblemSizeGroup
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
        - RstdScale: [True]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - PrefetchGlobalRead: [1]
        - 1LDSBuffer: [0]
        - PrefetchAcrossPersistent: [0]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 4, 1, 1]  # MT 64x64,  wg_m=1, wg_n=1
            - [16, 16, 32, 1, 1, 4, 4, 1, 2]  # MT 64x128, wg_m=1, wg_n=2
        - DepthU: [32, 64]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [4096, 64, 1, 4096]

LibraryLogic:
  ScheduleName: "gemm_variants"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2",
                "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"

LibraryClient:
