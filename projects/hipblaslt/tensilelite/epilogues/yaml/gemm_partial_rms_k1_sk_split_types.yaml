GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 0
  ExitOnFails: 0

BenchmarkProblems:
  # --------------------------------------------------------------------------
  # PartialRMS with configurable Gamma/Residual side-input types (bf16 or f32)
  # on the non-DP Stream-K (K-split) path. Exercises the f32 load/convert paths
  # added alongside the default bf16.
  # --------------------------------------------------------------------------
  -
    - # ProblemType — bf16 TN GEMM with PartialRMS epilogue
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      UsePartialRMS: True

    - BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 2, 1]   # MT0=128 MT1=128 wg0=2 wg1=1
        - PartialRMS: [True]
        - PartialRMSResidualAdd: [False, True]
        - PartialRMSGammaType: [b, s]
        - PartialRMSResidualType: [s]
        - StreamK: [3]
        - StreamKForceDPOnly: [0]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [128, 128, 1, 128]

LibraryLogic:
  ScheduleName: "partialrms_k1_sk_split_types"
  DeviceNames: ["Device 74a1", "Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
