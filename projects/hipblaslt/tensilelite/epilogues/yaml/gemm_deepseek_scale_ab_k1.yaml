GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 0
  ExitOnFails: 0

BenchmarkProblems:
  # --------------------------------------------------------------------------
  # DeepseekScaleAB (K1): fused GEMM + combined per-row scaleA and per-128col
  # scaleB dequantization epilogue.
  # D = alpha * scaleA[m] * scaleB[n//128] * (A_fp8 @ B_fp8) + beta*C.
  # free0=M, free1=N.
  # --------------------------------------------------------------------------
  -
    - # ProblemType — fp8 in, f32 out, f32 compute
      OperationType: GEMM
      DataType: F8
      DestDataType: S
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UseDeepseekScaleA: True
      UseDeepseekScaleB: True

    - BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 128, 1, 1, 4, 8, 1, 1]   # MT0=64   MT1=128  wg0=1 wg1=1
            - [16, 16, 128, 1, 1, 4, 4, 1, 2]   # MT0=64   MT1=128  wg0=1 wg1=2
            - [16, 16, 128, 1, 1, 4, 8, 2, 1]   # MT0=128  MT1=128  wg0=2 wg1=1
        - UseDeepseekScaleA: [True]
        - UseDeepseekScaleB: [True]
        - DeepseekScaleBlockK: [128]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [128]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [64, 128, 1, 128]
            - Exact: [128, 512, 1, 128]

# TestAxes is read by readTestAxes() in yaml_solution_builder.
TestAxes:
  K1:
    MFixed: [1, 7, 128, 129]
    NFixed: [128, 256, 320, 512]
    KFixed: [128]

LibraryLogic:
  ScheduleName: "deepseek_scale_ab_k1"
  DeviceNames: ["Device 74a1", "Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
