#
# Reproducer for Bug 2: PartialRMS DTL=0 + wg_n=2 + DepthU=64 correctness failure.
#
# All three failing tile sizes are included (MT64×256, MT256×256) with DepthU=64.
# Every combination of EPS/PGR/PKA/SU is expected to fail.
#
# The same geometry with DirectToLds=1 passes — adding DirectToLds:[1] to the YAML
# produces passing kernels that can be used as a baseline for assembly comparison.
#
# Problem size 8192^3 is required; small sizes pass.
#
# NOTE: The failures are observed in the full tuning sweep (tune_prms_8192.yaml) but
# may not reproduce reliably in isolation. If this YAML shows PASSED, run the full
# sweep instead — the failures appear to be order- or load-dependent.

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 128

BenchmarkProblems:
  -
    - # PartialRMS bf16 GEMM, no residual add
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      Sparse: 0
      UsePartialRMS: True
      PartialRMSResidualAdd: False

    - BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 4, 8, 1, 2]   # MT0=64  MT1=256, wg_m=1 wg_n=2
            - [16, 16, 32, 1, 1, 4, 8, 4, 2]   # MT0=256 MT1=256, wg_m=4 wg_n=2
        - PartialRMSResidualAdd: [False]
        - StreamK: [3]
        - StreamKForceDPOnly: [1]
        - StreamKAtomic: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [1]
        - DirectToLds: [0]
        - 1LDSBuffer: [0]
        - UseSubtileImpl: [True]
        - PartialRMS: [True]
        - PrefetchAcrossPersistent: [0]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - PreloadKernArgs: [False]
        - ExpandPointerSwap: [True]
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [8192, 8192, 1, 8192]

LibraryLogic:
  ScheduleName: "repro_bug2_dtl0_wgn2_du64"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
