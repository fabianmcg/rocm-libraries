#
# MXFP8 variant of the decomposed fused RMSNorm consumer (K3, RMSNORM_SCALE_APPLY).
# fp8-e4m3 A x fp8-e4m3 B -> bf16 D with MX block-32 UE8M0 scales on A and B, and the
# per-token rstd applied through the N-direction ScaleAlphaVec (UseScaleAlphaVec=2).
# No PartialRMS / no output requant on K3 (those are K1-only). StreamK=0 (data-parallel,
# no origami); LibraryType Equality pins the measured ExactWinners.

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  NumElementsToValidate: 0
  ExitOnFails: 0
  PrintLevel: 3
  KernelTime: True
  PrintSolutionRejectionReason: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1

BenchmarkProblems:

  ########## MXFP8 K3 consumer: UseScaleAlphaVec=2 (N-direction), fp8 in, bf16 out ##########
  -
    - # ProblemType — MX-scaled fp8 A/B in, bf16 D out, f32 compute, N-direction rstd scale
      OperationType: GEMM
      DataType: F8
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 2
      UseScaleD: False
      Sparse: 0

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 128, 1, 1,  8,  8, 2, 2]  # MT0=256 MT1=256
            - [16, 16, 128, 1, 1,  6,  4, 2, 2]  # MT0=192 MT1=128
            - [16, 16, 128, 1, 1,  8,  8, 1, 1]  # MT0=128 MT1=128
            - [16, 16, 128, 1, 1,  4,  8, 1, 1]  # MT0=64  MT1=128
        - StreamK: [0]
        - GlobalSplitU: [1]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [0, 1, 2]
        - PrefetchAcrossPersistent: [0]
        - UseSubtileImpl: [True]
        - StaggerU: [0]
        - DepthU: [256]
        - LocalReadVectorWidth: [16]
        - GlobalReadVectorWidthA: [16]
        - GlobalReadVectorWidthB: [16]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [16384, 2048, 1, 2048]
            - Exact: [64, 256, 1, 2048]

LibraryLogic:
  ScheduleName: "alphavec2_sweep_mxfp8_k1"
  DeviceNames: ["Device 75a0", "Device 75b0", "Device 75a2", "Device 75b2", "Device 75a3", "Device 75b3", "Device 75a8", "Device 75b8"]
  ArchitectureName: "gfx950"
  LibraryType: "Equality"
