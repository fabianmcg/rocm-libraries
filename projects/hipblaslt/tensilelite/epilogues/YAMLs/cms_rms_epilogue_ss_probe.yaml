#
# SourceSwap=True CMS MegaFused RMSEpilogue — numerical correctness validation.
#
# PASSING: all three output buffers (D, partialBuf, residualOut) match reference.
# SourceSwap=True is supported for VectorWidthA=VectorWidthB=1 via an intra-tile
# AGPR LDS transpose (SS->nonSS before the epilogue emitter, nonSS->SS after).
#
# Tile parameters: VectorWidthA=VectorWidthB=1, SourceSwap=True, bf16, gfx950.
#   MatrixInstruction [16,16,32,1,1,8,8,2,2]: MT0=256 MT1=256, MIWaveTile[8,8], MIWaveGroup[2,2].

GlobalParameters:
  MinimumRequiredVersion: 5.0.0
  SleepPercent: 0
  EnqueuesPerSync: 20
  NumWarmups: 20
  KernelTime: true
  NumElementsToValidate: -1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeD: 12
  CSVExportWinner: true
  CSVMergeSameProblemID: true
  PreciseKernelTime: false
  Device: 0
  SkipSlowSolutionRatio: 0.0
  # PrintSolutionRejectionReason: true
  KeepBuildTmp: true
  RotatingBufferSize: 1024

BenchmarkProblems:
  -
    -
      OperationType: GEMM
      DataType: b
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: False
      Batched: True
      StridedBatched: True
      GroupedGemm: False
      UseBias: 0
      UseScaleAB: ""
      UseScaleCD: False
      UseScaleAlphaVec: 0
      UseScaleD: False
      Sparse: 0
      UseRMSEpilogue: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
            - [16, 16, 32, 1, 1, 8, 8, 2, 2]   # MT0=256 MT1=256, MIWaveTile[8,8], MIWaveGroup[2,2]
        - RMSEpilogue: [True]
        - UseSubtileImpl: [False]
        - StreamK: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: ["SingleBuffer"]
        - ScheduleIterAlg: [3]
        - PrefetchGlobalRead: [2]
        - PrefetchLocalRead: [1]
        - PrefetchAcrossPersistent: [0]
        - DirectToLds: [1]
        - SourceSwap: [True]
        - VectorWidthA: [1]
        - VectorWidthB: [1]
        - StaggerU: [0]
        - DepthU: [64]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - StoreVectorWidth: [-1]
        - GlobalReadVectorWidthA: [8]
        - GlobalReadVectorWidthB: [8]
        - LocalReadVectorWidth: [8]
        # These three must be explicitly resolved for the CMS catalog match at
        # Solution.py:3738 (hasCustomSchedule reads LocalReadVectorWidthA/B directly
        # before the auto-resolution at line 4669, and DtlPlusLdsBuf before line 6403).
        - LocalReadVectorWidthA: [8]
        - LocalReadVectorWidthB: [8]
        - DtlPlusLdsBuf: [0]
        # TransposeLDS must be 1 for isTN(kernel)+TLDS==1 branch in the schedule.
        - TransposeLDS: [1]
        # UseCustomMainLoopSchedule=1 must be explicit so megaFusedEpilogueCompatible
        # at Solution.py:1602 can determine isCMS=True before hasCustomSchedule runs.
        - UseCustomMainLoopSchedule: [1]
        - PreloadKernArgs: [False]
        - 1LDSBuffer: [0]
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
            - Exact: [2048, 16384, 1, 2048]

LibraryLogic:
  ScheduleName: "cms_rms_epilogue_ss_probe"
  DeviceNames: ["Device 75a0"]
  ArchitectureName: "gfx950"
  LibraryType: "Equality"
