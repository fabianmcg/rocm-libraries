[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.9"]
build-backend = "scikit_build_core.build"

[project]
name = "amdgpu-exec"
version = "0.1.0"
description = "Compile AMDGPU ASM kernels and execute them on AMD GPUs via Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.1.0",
    "ml_dtypes>=0.5.0",
    "typing_extensions>=4.12.2",
]

[tool.scikit-build]
# Pin the build backend behavior to the version declared above.
minimum-version = "build-system.requires"

wheel.license-files = ["LICENSE*", "CREDITS"]

# Keep build artifacts in a stable directory to speed up editable rebuilds.
build-dir = "build/{wheel_tag}"

# The pure-Python package lives under python/; map it to the wheel root.
wheel.packages = ["python/amdgpu_exec"]

cmake.build-type = "Release"

[tool.scikit-build.editable]
# Rebuild the extension automatically when sources change on import.
mode = "redirect"
rebuild = true
verbose = true

[tool.cibuildwheel]
archs = ["x86_64"]
# rocm-sdk Python packages require glibc >= 2.28; musllinux has no ROCm wheels.
manylinux-x86_64-image = "manylinux_2_28"
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*"]
skip = ["*-musllinux*"]
# ROCm's LLVM links zstd, so its imported target must be resolvable at configure.
before-all = "dnf install -y libzstd-devel"
before-build = [
  "pip install --index-url https://rocm.nightlies.amd.com/whl-multi-arch/ 'rocm[devel]==7.14.*'",
  "rocm-sdk init --quiet",
]
# Both extensions are statically linked against LLVM/LLD; only allowlisted
# system libs remain as dynamic deps, so standard auditwheel repair works.
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
